<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login with Honeycomb</title>
<script>
function getAuthorizationCodeFromUrl() {
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get("code");
}

function loginWithHoneycomb() {
  const authUrl =
    "https://ui.honeycomb.io/oauth/authorize" +
    "?client_id=hcaoc_01kdgkggz78csrvx0e5cyd4e6xx" +
    "&response_type=code" +
    "&code_challenge=MKfcOrCYrRrQ_5hvZe18M3vyeUqzixrdsy5fMnJzaS8" +
    "&code_challenge_method=S256" +
    "&redirect_uri=" + encodeURIComponent("https://honeycomb-7ay6.onrender.com/callback");

  window.location.href = authUrl;
}

async function getAccessToken(code) {
  try {
    const res = await fetch("/exchange", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code })
    });
    const data = await res.json();
    document.getElementById("authorization-code").textContent = "Access Token Generated";
    document.getElementById("user-info").textContent = JSON.stringify(data, null, 2);
  } catch (err) {
    document.getElementById("authorization-code").textContent = "Error: " + err;
  }
}

async function submitBoard() {
  const boardId = document.getElementById("board-id").value;
  const res = await fetch("/boards", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ boardId })
  });
  const data = await res.json();
  document.getElementById("board-output").textContent = JSON.stringify(data, null, 2);
}

window.onload = () => {
  const code = getAuthorizationCodeFromUrl();
  if (!code) {
    loginWithHoneycomb();
    return;
  }
  document.getElementById("authorization-code").textContent = "Authorization Code: " + code;
  getAccessToken(code);
};
</script>
</head>
<body>
<h1>Login with Honeycomb</h1>
<button onclick="loginWithHoneycomb()">Login</button>

<p id="authorization-code"></p>

<h2>User Information</h2>
<pre id="user-info"></pre>

<h2>Board Lookup</h2>
<input id="board-id" placeholder="Enter Board ID" />
<button onclick="submitBoard()">Submit</button>

<pre id="board-output"></pre>
</body>
</html>
